services:
  - type: web
    name: polotno-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: bun install && bun run build
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://polotno-ten.vercel.app
      - key: PORT
        value: 4000
